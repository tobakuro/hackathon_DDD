name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 毎週月曜 朝9時 (JST) に定期スキャン
    - cron: "0 0 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # ----------------------------------------------------------------
        # プロジェクトで使用する言語に合わせて編集してください
        # 対応言語: cpp, csharp, go, java, javascript, kotlin, python, ruby, swift
        # JavaScript/TypeScript は `javascript` で両方カバーされます
        # ----------------------------------------------------------------
        language: []

    steps:
      - name: Warn if no language configured
        if: ${{ matrix.language == '' || toJson(matrix.language) == '[]' }}
        run: |
          echo "::warning::CodeQL: matrix.language が空です。codeql.yml の language を設定してください。"
          exit 1

      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
