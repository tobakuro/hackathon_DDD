apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: attacker
  name: attacker
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: attacker
  template:
    metadata:
      labels:
        io.kompose.service: attacker
    spec:
      containers:
        - env:
            - name: TARGET_URL
              value: http://target-server:8080
          image: attacker
          name: attacker
          imagePullPolicy: Never
      restartPolicy: Always
