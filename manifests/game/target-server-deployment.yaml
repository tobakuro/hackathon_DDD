apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: target-server
  name: target-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: target-server
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: target-server
    spec:
      containers:
        - image: target-server
          name: target-server
          resources:
            limits:
              cpu: 50m
              memory: "67108864"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
