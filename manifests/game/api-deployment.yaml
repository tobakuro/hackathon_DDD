apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: api
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: api
  template:
    metadata:
      labels:
        io.kompose.service: api
    spec:
      serviceAccountName: api
      containers:
        - image: api
          name: api
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
      restartPolicy: Always
